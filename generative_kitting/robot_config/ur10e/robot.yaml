# UR10e + Robotiq 2F-140 on ceiling gantry
# measured on the live stage 2026-10-12, gripper pointing down

robot:
  name: ur10e_2f140_gantry
  arm: ur10e
  gripper: robotiq_2f140
  stage: ${PROJECT_ROOT}/UR10e_Container_Assets/AIKIDO_ur10e_swapped.usd

articulation:
  root: /World/gantry
  num_dof: 15

# relative to articulation.root
prims:
  arm_base: gantry_home/ur10e/base_link
  ee: gantry_home/ur10e/ee_link   # no rigid body: its USD pose does NOT follow the arm (use tool / TCP)
  tool: gantry_home/ur10e_robotiq_2f140/robotiq_base_link
  gripper_root: gantry_home/ur10e_robotiq_2f140

joints:
  gantry: gantry_vagn_joint
  arm:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  gripper_drive: finger_joint
  # drive = finger target, pad = pad angle, mirror = minus pad angle,
  # zero = hold at 0, free = leave alone. Pad angle = finger target, frozen at contact.
  gripper_modes:
    finger_joint: drive
    right_outer_knuckle_joint: drive
    left_outer_finger_joint: zero        # rigid on the real 2F-140; free let the loop collapse
    right_outer_finger_joint: zero
    # passive four-bar: with gripper.armature the loop alone keeps the pads
    # parallel (<2 deg); drives here held the linkage and ate the squeeze
    left_inner_finger_joint: free
    right_inner_finger_joint: free
    left_inner_finger_pad_joint: free
    right_inner_finger_pad_joint: free

gantry:
  x_offset: 1.27
  limits: [-3.10, 0.0]

# tool down, TCP (-0.05, -0.30, 1.08) between rack and tray; not singular
home_joints: [-1.32, 2.037, -1.762, -2.533, -1.989, -1.105, 1.571]

tcp:
  offset: 0.189     # robotiq_base_link -> pad centre along +Z, at ~55 mm grasp
  frame: tool

orientation:
  tool_down: [0.0, 1.0, 0.0, 0.0]          # tool +Z -> world -Z, camera +X
  scan: [0.0, 0.70711, -0.70711, 0.0]      # tool_down yawed -90 deg

gripper:
  stroke: 0.140
  body_width: 0.160
  force_limit: 40.0
  finger:
    open: 0.0
    # blind close / default hold (gripper close, pick_retract or place without
    # grip_hold): full close, the drive stops on the part like the real 2F-140.
    # 0.5 (57 mm) opened the fingers on a held 30 mm tube and dropped it (2026-10-14).
    close: 0.76
    max_rad: 0.76       # pads touch
  # parallel pads, measured tool-down 2026-10-12
  # [finger_joint rad, pad gap m, pad-face centre below tool frame m]
  width_table:
    - [0.0, 0.1438, 0.1756]
    - [0.1, 0.1284, 0.1819]
    - [0.2, 0.1117, 0.1874]
    - [0.3, 0.0941, 0.1920]
    - [0.4, 0.0757, 0.1957]
    - [0.5, 0.0566, 0.1976]
    - [0.6, 0.0370, 0.1994]
    - [0.7, 0.0171, 0.2002]
    - [0.76, 0.0051, 0.2002]
  # applied at bridge start; [stiffness N*m/rad, damping, max force N*m]
  joint_gains:
    finger_joint: [114591.6, 11459.2, 10.0]   # 30-60 N per pad over the stroke
  # joint armature [kg m^2] on every gripper_modes joint, applied at bridge start.
  # The driven knuckle is 9 g (I ~2e-7), so without it the solver passes only
  # ~1 N*m of the drive through the closed loop (pads 2-15 N at any cap).
  # 1e-3 measured best 2026-10-13: 1e-4 lets pads tilt, 1e-2 halves the force.
  armature: 0.001
  grasp_confirm_rad: 0.02   # held if finger stops this far short of target
  # widest part we grasp [m] (motor_valve 117-125 mm across). A "grasp" at a
  # wider pad gap is fingers stopped on the floor or a wall, not a part.
  max_part_width: 0.130
  adaptive_close:
    min_force: 0.5
    step_rad: 0.02
    max_steps: 40       # 40 x step_rad reaches max_rad
    overshoot_rad: 0.06 # squeeze past contact; must exceed grasp_confirm_rad
    stall_rad: 0.03     # finger lagging its target this much = contact
  contact_sensor: gantry_home/ur10e_robotiq_2f140/left_inner_finger/Contact_Sensor
  finger_links:
    - gantry_home/ur10e_robotiq_2f140/left_inner_finger
    - gantry_home/ur10e_robotiq_2f140/right_inner_finger
    - gantry_home/ur10e_robotiq_2f140/left_outer_finger
    - gantry_home/ur10e_robotiq_2f140/right_outer_finger
    - gantry_home/ur10e_robotiq_2f140/robotiq_base_link

# absolute paths: camera is not under the articulation root
wrist_camera:
  root: /World/rsd555
  depth: /World/rsd555/Depth
  rgb: /World/rsd555/Camera_OmniVision_OV9782_Color
  imu: /World/rsd555/Imu_Sensor
  mount_link: gantry_home/ur10e/wrist_3_link
  self_filter_radius: 0.10
  ee_offset_xy: [0.0, 0.0]   # empirical, tune from pick results

cumotion:
  urdf: AIKIDO.urdf          # relative to this folder
  xrdf: AIKIDO.xrdf          # spheres in URDF link frames, for cuMotion
  self_filter_xrdf: AIKIDO.editor.xrdf   # spheres in USD link frames
  root_link: gantry
  tool_frame: robotiq_base_link
  max_vel: [0.5, 1.5, 1.5, 1.5, 2.0, 2.0, 2.0]
  max_acc: [1.0, 2.0, 2.0, 2.0, 2.5, 2.5, 2.5]
  # URDF link -> prim, for the point-cloud self-filter
  link_prims:
    gantry: .
    vagn: gantry_home/vagn
    base_link: gantry_home/ur10e/base_link
    shoulder_link: gantry_home/ur10e/shoulder_link
    upper_arm_link: gantry_home/ur10e/upper_arm_link
    forearm_link: gantry_home/ur10e/forearm_link
    wrist_1_link: gantry_home/ur10e/wrist_1_link
    wrist_2_link: gantry_home/ur10e/wrist_2_link
    wrist_3_link: gantry_home/ur10e/wrist_3_link
    robotiq_base_link: gantry_home/ur10e_robotiq_2f140/robotiq_base_link
    left_outer_knuckle: gantry_home/ur10e_robotiq_2f140/left_outer_knuckle
    right_outer_knuckle: gantry_home/ur10e_robotiq_2f140/right_outer_knuckle
    left_outer_finger: gantry_home/ur10e_robotiq_2f140/left_outer_finger
    right_outer_finger: gantry_home/ur10e_robotiq_2f140/right_outer_finger
    left_inner_finger: gantry_home/ur10e_robotiq_2f140/left_inner_finger
    right_inner_finger: gantry_home/ur10e_robotiq_2f140/right_inner_finger
    left_inner_knuckle: gantry_home/ur10e_robotiq_2f140/left_inner_knuckle
    right_inner_knuckle: gantry_home/ur10e_robotiq_2f140/right_inner_knuckle

# collision world: corner depth cameras -> robot mask -> nvblox TSDF/ESDF
# (nvblox_service/, separate venv). Measured on the live stage 2026-10-14.
nvblox:
  url: http://127.0.0.1:8610
  voxel_size: 0.02            # 2 cm fits beside Isaac in 8 GB, 1 cm does not
  cameras:                    # must be bridge pointcloud cameras (shared render products)
    - /World/pointcloud_view/cam1
    - /World/pointcloud_view/cam2
    - /World/pointcloud_view/cam3
    - /World/pointcloud_view/cam4
    # the rack hides the bin parts from cam1-4 (71-100% occluded, 2026-10-14)
    - /World/Camera             # overhead, above the rack
    - /World/Camera_Kit         # overhead, above the tray
  # world box that is integrated; pixels landing outside are masked out.
  # floor z=0, rack top z=1.81, gantry x [-2.40, 2.56], pallet y [-1.52, 1.59]
  workspace_min: [-2.6, -1.6, -0.05]
  workspace_max: [2.6, 1.6, 2.1]
  # m added to each XRDF sphere when masking depth. Measured 2026-10-14 by
  # hiding the robot: real surface lies up to 4.2 cm outside the vagn
  # spheres and <= 3.6 cm outside the arm's. The static frame (gantry link)
  # sticks out up to 8.8 cm; that rim stays in the map as real structure
  # (cuMotion skips world collision for gantry/vagn). A 10 cm frame margin
  # erased the rack end next to the frame column at x -2.35.
  robot_mask_margin: 0.04
  robot_mask_link_margins:
    vagn: 0.05                # moves with the gantry, must not stay in the map
  max_integration_distance: 9.0   # corner cams are ~3.7 m up, cell diagonal ~8 m
  # surface band that seeds the ESDF. 1.0 (nvblox default) read up to 4+ cm
  # too far near small parts; 2.0: median +1.0 cm, p90 +2.1 cm (2026-10-14)
  esdf_max_site_distance_vox: 2.0
  # per-update weight decay (null = off). Measured offline 2026-10-14 by hiding
  # motor_valve_2: off never fully clears it (far cameras add tiny weights);
  # 0.5 clears it in 2 updates and an unseen region (e.g. under the arm)
  # lasts ~10 updates; 0.2 clears in 1 but forgets unseen space in ~4.
  tsdf_decay_factor: 0.5
  # m subtracted from the SDF handed to cuMotion (inflates obstacles). The
  # EDT SDF reads -0.5 cm (closer) at the median; 99.5 % of surface points lie
  # within 2 cm of it; cuMotion adds 0.7-1.7 cm on its own (2026-10-14).
  sdf_safety_margin: 0.02
  # grasp target (exclude_points = part top): vertical column marked free
  # in the map from top - target_carve_below up. motor_valve corners reach
  # 9.6 cm from its centre; 8 cm left them next to the open fingers.
  # With 10 cm the target plans and the neighbouring valve stays blocked
  # (2026-10-14).
  target_carve_radius: 0.10
  target_carve_below: 0.10
  # sphere at the pad centre masked from depth while a grasp is confirmed
  # (motor_valve half-diagonal ~0.11 m); pick_close held_radius overrides
  held_part_radius: 0.11
