# UR10e + Robotiq 2F-140 on ceiling gantry
# measured on the live stage 2026-10-12, gripper pointing down

robot:
  name: ur10e_2f140_gantry
  arm: ur10e
  gripper: robotiq_2f140
  stage: ${PROJECT_ROOT}/UR10e_Container_Assets/AIKIDO_ur10e_swapped.usd

articulation:
  root: /World/gantry
  num_dof: 15

# relative to articulation.root
prims:
  arm_base: gantry_home/ur10e/base_link
  ee: gantry_home/ur10e/ee_link
  tool: gantry_home/ur10e_robotiq_2f140/robotiq_base_link
  gripper_root: gantry_home/ur10e_robotiq_2f140

joints:
  gantry: gantry_vagn_joint
  arm:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  gripper_drive: finger_joint
  # drive = set to finger target, zero = hold at 0, free = leave alone
  gripper_modes:
    finger_joint: drive
    right_outer_knuckle_joint: drive
    left_outer_finger_joint: free
    right_outer_finger_joint: free
    left_inner_finger_joint: zero
    right_inner_finger_joint: zero
    left_inner_finger_pad_joint: free
    right_inner_finger_pad_joint: free

gantry:
  x_offset: 1.27
  limits: [-3.10, 0.0]

# tool down, TCP (-0.05, -0.30, 1.08) between rack and tray; not singular
home_joints: [-1.32, 2.037, -1.762, -2.533, -1.989, -1.105, 1.571]

tcp:
  offset: 0.189     # robotiq_base_link -> pad centre along +Z, at ~55 mm grasp
  frame: tool

orientation:
  tool_down: [0.0, 1.0, 0.0, 0.0]          # tool +Z -> world -Z, camera +X
  scan: [0.0, 0.70711, -0.70711, 0.0]      # tool_down yawed -90 deg

gripper:
  stroke: 0.140
  body_width: 0.160
  force_limit: 40.0
  finger:
    open: 0.0
    close: 0.5
    close_min: 0.55
    close_max: 0.69
    max_rad: 0.76       # pads touch
  # finger_joint [rad] -> pad gap [m]
  width_table:
    - [0.0, 0.141]
    - [0.210, 0.104]
    - [0.392, 0.073]
    - [0.486, 0.055]
    - [0.582, 0.036]
    - [0.679, 0.017]
    - [0.730, 0.006]
    - [0.760, 0.0]
  grip_overshoot: 0.060
  entry_clearance: 0.020
  grasp_confirm_rad: 0.05
  adaptive_close:
    min_force: 0.5
    step_rad: 0.02
    max_steps: 30
    overshoot_rad: 0.04
  contact_sensor: gantry_home/ur10e_robotiq_2f140/left_inner_finger/Contact_Sensor
  finger_links:
    - gantry_home/ur10e_robotiq_2f140/left_inner_finger
    - gantry_home/ur10e_robotiq_2f140/right_inner_finger
    - gantry_home/ur10e_robotiq_2f140/left_outer_finger
    - gantry_home/ur10e_robotiq_2f140/right_outer_finger
    - gantry_home/ur10e_robotiq_2f140/robotiq_base_link

# absolute paths: camera is not under the articulation root
wrist_camera:
  root: /World/rsd555
  depth: /World/rsd555/Depth
  rgb: /World/rsd555/Camera_OmniVision_OV9782_Color
  imu: /World/rsd555/Imu_Sensor
  mount_link: gantry_home/ur10e/wrist_3_link
  self_filter_radius: 0.10
  ee_offset_xy: [0.0, 0.0]   # empirical, tune from pick results

cumotion:
  urdf: AIKIDO.urdf          # relative to this folder
  xrdf: AIKIDO.xrdf          # spheres in URDF link frames, for cuMotion
  self_filter_xrdf: AIKIDO.editor.xrdf   # spheres in USD link frames
  root_link: gantry
  tool_frame: robotiq_base_link
  max_vel: [0.5, 1.5, 1.5, 1.5, 2.0, 2.0, 2.0]
  max_acc: [1.0, 2.0, 2.0, 2.0, 2.5, 2.5, 2.5]
  # URDF link -> prim, for the point-cloud self-filter
  link_prims:
    gantry: .
    vagn: gantry_home/vagn
    base_link: gantry_home/ur10e/base_link
    shoulder_link: gantry_home/ur10e/shoulder_link
    upper_arm_link: gantry_home/ur10e/upper_arm_link
    forearm_link: gantry_home/ur10e/forearm_link
    wrist_1_link: gantry_home/ur10e/wrist_1_link
    wrist_2_link: gantry_home/ur10e/wrist_2_link
    wrist_3_link: gantry_home/ur10e/wrist_3_link
    robotiq_base_link: gantry_home/ur10e_robotiq_2f140/robotiq_base_link
    left_outer_knuckle: gantry_home/ur10e_robotiq_2f140/left_outer_knuckle
    right_outer_knuckle: gantry_home/ur10e_robotiq_2f140/right_outer_knuckle
    left_outer_finger: gantry_home/ur10e_robotiq_2f140/left_outer_finger
    right_outer_finger: gantry_home/ur10e_robotiq_2f140/right_outer_finger
    left_inner_finger: gantry_home/ur10e_robotiq_2f140/left_inner_finger
    right_inner_finger: gantry_home/ur10e_robotiq_2f140/right_inner_finger
    left_inner_knuckle: gantry_home/ur10e_robotiq_2f140/left_inner_knuckle
    right_inner_knuckle: gantry_home/ur10e_robotiq_2f140/right_inner_knuckle
