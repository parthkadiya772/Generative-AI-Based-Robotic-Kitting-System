# ============================================================
# Generative Kitting System — Master Configuration
# ============================================================

simulation:
  usd_scene_path: "${PROJECT_ROOT}/AIKIDO.usd"
  robot_prim_path: "/World/gantry"
  ur10_base_path: "/World/gantry/gantry_home/ur10_flattened/ur10_instanceable/base_link"
  ee_path: "/World/gantry/gantry_home/ur10_flattened/ur10_instanceable/ee_link"
  camera_prim_path: "/World/Camera"
  depth_camera_prim_path: "/World/rsd555/Depth"
  imu_sensor_prim_path: "/World/rsd555/Imu_Sensor"
  physics_dt: 0.01667          # 1/60
  rendering_dt: 0.01667        # 1/60

  # Gantry configuration
  gantry_x_joint: "/World/gantry/gantry_home/vagn/gantry_vagn_joint"
  gantry_x_offset: 1.27

  # ── cuMotion robot description ──────────────────────────────
  # Directory holding the URDF + XRDF + meshes/, exported from Isaac
  # Sim. The XRDF `cspace:` block defines the planned joints and their
  # order, and its `geometry:` spheres are the robot's own collision
  # model — the planner's idea of the arm comes from here, not the USD.
  # The bridge keeps its own copy of these names (it runs standalone in
  # the Script Editor and does not read this file).
  robot_config_path: "${ROBOT_CONFIG_PATH}"
  robot_urdf_filename: "AIKIDO.urdf"
  robot_xrdf_filename: "AIKIDO.xrdf"
  # Tool frame cuMotion plans for. Poses are converted from the TCP
  # target using execution.gripper_tcp_offset before planning.
  cumotion_tool_frame: "robotiq_base_link"

  # Gripper finger prim paths (Robotiq 2F-140)
  gripper_finger_paths:
    - "/World/gantry/gantry_home/ur10_flattened/robotiq_fixed_physics/Robotiq_2F_140_physics_edit/left_inner_finger"
    - "/World/gantry/gantry_home/ur10_flattened/robotiq_fixed_physics/Robotiq_2F_140_physics_edit/right_inner_finger"
    - "/World/gantry/gantry_home/ur10_flattened/robotiq_fixed_physics/Robotiq_2F_140_physics_edit/left_outer_finger"
    - "/World/gantry/gantry_home/ur10_flattened/robotiq_fixed_physics/Robotiq_2F_140_physics_edit/right_outer_finger"
    - "/World/gantry/gantry_home/ur10_flattened/robotiq_fixed_physics/Robotiq_2F_140_physics_edit/robotiq_base_link"
  box_prim_path: "/World/robot_facade_full"

  # ── Wrist-scan pipeline (current approach) ─────────────────────
  # The overhead camera is now used for the live UI feed only —
  # all part-perception happens through the wrist-mounted RealSense.
  # The robot moves above the bin, faces ee_link downward, and the
  # wrist RGB image is fed to the VLM. Bin + tray world coordinates
  # come from these USD prims (no overhead VLM landmark detection).
  bin_prim_path:  "/World/robot_facade_full"
  tray_prim_path: "/World/box_840"
  wrist_rgb_camera_prim_path: "/World/rsd555/Camera_OmniVision_OV9782_Color"

  # Scan-pose marker prim REMOVED from the scene — the workflow now
  # derives the safe ee_link Z geometrically from
  #   bin_top_z + execution.gripper_tcp_offset
  #              + execution.bin_wall_finger_clearance
  # See KittingWorkflowEngine._safe_floor_z(). Re-add a marker prim
  # path here only if you want to override the geometric formula with
  # a static USD transform.
  # scan_pose_prim_path: "/World/robo_eye"

  # ee_link orientation [w, x, y, z] applied at every realign before
  # a pick. Default rotates the standard downward pose by -90° yaw
  # about world Z so the wrist camera ends up on the FRONT side of
  # the gripper (not the back). Tweak the sign of z if the camera
  # ends up on the wrong side. Keep the quaternion normalised; null
  # / missing → bridge falls back to DOWNWARD_ORIENTATION.
  scan_pose_orientation: [0.5, 0.5, 0.5, -0.5]

# ─── Perception (VLM) ───────────────────────────────────────
perception:
  # Gemma4 is the default for both perception and orchestration so a
  # single small model covers the whole pipeline. Override via the
  # Streamlit dropdown if you want Qwen-VL's higher recall on dense
  # scenes.
  vlm_provider: "ollama_gemma"        # Active provider (overridden by UI model selection)
  vlm_model: "gemma4:e4b"             # Active model  (overridden by UI model selection)
  vlm_base_url: "${OLLAMA_BASE_URL}"   # Active endpoint
  max_retries: 2
  temperature: 0.0                    # Low temperature for deterministic perception
  confidence_threshold: 0.5           # Reject objects below this confidence
  vlm_num_ctx: 32768                  # Larger context for catalogue + image tokens
  vlm_num_predict: 8192               # Give the VLM headroom to finish JSON

  # ── Available VLM Models (shown as dropdown in Streamlit UI) ──
  vlm_models:

    - name: "Gemma4 2B"
      provider: "ollama_gemma"
      model: "gemma4:e2b"
      base_url: "${OLLAMA_BASE_URL}"

    - name: "Gemma4 4B"
      provider: "ollama_gemma"
      model: "gemma4:e4b"
      base_url: "${OLLAMA_BASE_URL}"

    # vLLM serves models under their HuggingFace repo id — this must
    # match the --model / --served-model-name the server was started
    # with, or the request 404s with "model not found".
    - name: "Qwen3-VL (vLLM)"
      provider: "vllm"
      model: "Qwen/Qwen3-VL"
      base_url: "${VLLM_BASE_URL}"

  # ── Zero-Shot Detector (precise bounding boxes — replaces VLM coord guesses) ──
  # detector_url: "${DETECTOR_BASE_URL}"  # set DETECTOR_BASE_URL in .env to use a remote detector
  detector_model: "owlv2"              # "owlv2" (lightweight) or "grounding_dino" (more accurate)
  detector_confidence: 0.15            # minimum detection confidence
  detector_device: "cpu"               # "cpu" or "cuda" (set to cuda if you have a local GPU)

  # When true, drop any VLM-detected object that did NOT get a
  # matching detector bbox. Without a bbox, depth projection runs
  # on the VLM's guessed image_position which is unreliable (off
  # by 5-15%, sometimes hallucinated entirely) and can send the
  # robot to a divider wall. Bbox-confirmed detections are far
  # safer because they require BOTH the VLM (correct label) AND
  # the detector (correct location) to agree.
  # Set false ONLY if you trust the VLM's image_position alone.
  require_detector_bbox: true

  # ── Detector safety net (OWL-ViT2 / Grounding DINO path only) ──
  # Run OWL-ViT2 with the FULL parts_catalogue.yaml detector_queries on
  # every scan, not just the labels Gemma4 reported. For every OWL hit
  # that no VLM detection claimed, synthesise a scene object using the
  # query → canonical label map. This recovers parts when the VLM (e.g.
  # Gemma4 4B) inconsistently misses some — OWL still finds them.
  # Disable for strict VLM-led behaviour.
  detector_finds_missed_parts: true

  # ── Per-instance VLM label verification (open-vocabulary) ──
  # After the scene is populated, crop each detection and ask the VLM
  # "what is this?" with the catalogue as the choice set. Re-labels
  # mistakes from the first-pass VLM and from OWL query mislabelling
  # (e.g. motor_valves grabbed by the "silver hinge" query). Catalogue
  # is the single source of truth — adding a new part means a YAML
  # edit, no code changes, and no per-camera tuning. Costs N extra VLM
  # calls per scan (~3-10s each on a small crop), so default is OFF.
  # Enable when first-pass labels are unreliable.
  # Disabled — per-instance verification was over-correcting in the
  # opposite direction, relabelling almost every silver part as
  # ``motor_valve`` because the catalogue's motor_valve description
  # ("silver metallic body with central bore") matches Gemma4's
  # interpretation of any silver close-up. The spatial-fallback in
  # ``_assign_detector_bboxes`` (rescues VLM detections that have no
  # label-matching OWL bbox by spatially matching to nearby unclaimed
  # bboxes) is doing the heavy lifting now without the over-correction
  # bias. Re-enable only if you've made the verification prompt MORE
  # discriminative (e.g. listing not_to_confuse_with examples per
  # part type) — otherwise the cure is worse than the disease.
  verify_labels_with_vlm: false
  # Minimum VLM confidence to override an existing label. Lower values
  # are more aggressive (more re-labels), higher values are conservative.
  verify_labels_min_confidence: 0.7

  # ── Camera_Kit place-verification confidence threshold ──
  # After every place, the workflow captures the /World/Camera_Kit
  # frame and asks the VLM whether the named part actually landed in
  # the kitting tray. The verifier returns:
  #     in_tray=True  → place succeeded
  #     in_tray=False → place failed (re-initiate cycle)
  #     in_tray=None  → inconclusive (no retry)
  # With max_pick_retries=3 every confirmed negative triggers a full
  # re-pick, which is expensive when the VLM produces low-confidence
  # false negatives ("I think the tray is empty but I'm not sure").
  # This knob gates the retry: only treat in_tray=False as a real
  # failure when the VLM's reported confidence is >= this threshold.
  # Below it, the verdict is downgraded to "inconclusive" so the
  # workflow proceeds without re-picking.
  # 0.6 default — set to 0.0 to retry on every negative (strict
  # mode), or 1.0 to disable verification-driven retries entirely.
  place_verify_min_confidence: 0.6

  # ── Wrist-driven XY refinement (apply or only inform?) ──
  # The wrist VLM is asked to pinpoint the part's pixel centre in
  # the close-range view; the bridge projects that pixel through
  # the wrist camera's actual USD transform to produce a "refined"
  # world XY. The geometry is correct, but the VLM's pixel-centroid
  # guess is only ~5 % accurate (~25 mm world error at 40 cm camera
  # height) — applying its correction is *less* accurate than the
  # overhead OWL-ViT2 bbox centre that produced the original Phase 2
  # XY (sub-pixel detector accuracy → <1 cm world error).
  #
  # When this flag is true (default) the workflow only USES the
  # wrist verify for visibility / path-clear checks, NOT for XY
  # adjustment. The Z correction still applies because the wrist
  # depth is much more accurate than the overhead depth at close
  # range. If you observe genuine large XY errors that the overhead
  # didn't catch, set this false to re-enable the (less precise)
  # wrist refinement and rely on the 5 cm cap to reject neighbour-
  # part hijacks.
  # NOTE on history: this was set to true earlier when we believed
  # the overhead OWL detector was sub-pixel accurate. The diagnostic
  # log of 2026-05-10 disproved that — overhead error was 58 mm vs
  # wrist projection's 17 mm for the same gear. With the wrist VLM
  # prompt now constrained to the centre-most part and the 5 cm
  # neighbour-rejection cap, the wrist refinement is the more
  # accurate signal of the two. Setting back to false so the wrist
  # XY correction is APPLIED (not just logged). USD-snap still
  # overrides both when it fires; this is the fallback for any
  # detection that USD-snap rejects (no matching prim within
  # snap_radius) — and the path the system will take once on a real
  # robot where USD ground truth is unavailable.
  wrist_xy_refinement_informational_only: false


  # ── Realignment frame: gripper-over-part vs camera-over-part ──
  # The wrist projection returns the part's WORLD XY (already
  # accounting for the camera's mounting offset from ee_link).
  # By default the workflow targets ee_link to that XY so the
  # GRIPPER lands above the part — correct for grasping.
  #
  # Some scenes have a non-trivial offset between the wrist RGB
  # camera and ee_link (the RealSense RSD455 mounts the camera
  # slightly forward and to one side of the gripper TCP). When
  # ``realign_camera_over_part`` is true, the workflow subtracts
  # the (cam_world_xy − ee_world_xy) vector from the realignment
  # target, so the CAMERA — not the gripper — ends up above the
  # part. This is useful when:
  #   * The gripper body would occlude the target during a final
  #     wrist re-verification.
  #   * You want a clean wrist-camera image of the grasp point
  #     before descending (e.g. for evaluation logging).
  # Default false because the natural "gripper above part" choice
  # is what the descent + close need. Enable only if the wrist
  # verification is more important than the immediate grasp pose.
  realign_camera_over_part: false

  # ── Depth-analysis VLM check at the approach pose ──
  # After the gantry-driven approach moves ee_link near the part,
  # the workflow can capture a depth image and ask the VLM "is the
  # part visible / where is its centre / is the descent path
  # clear?". The check has the same geometric weakness as the
  # pre-grasp wrist VLM: the wrist depth camera sits ~55 mm offset
  # from ee_link, and at the approach altitude the part can be
  # outside the depth camera's narrow useful range — Gemma4 then
  # confidently reports "no part visible, confidence 0.0" and
  # aborts an otherwise good pick.
  #
  # Set false to skip the depth-analysis VLM call AND its abort
  # path. The earlier overhead VLM + OWL-ViT2 detection already
  # confirmed the part exists, the wrist verify+realign step
  # confirms visibility from close range, the contact-aware descent
  # handles unexpected surfaces, and the post-grasp wrist VLM
  # confirms the actual grasp — the depth-analysis check is
  # redundant. The bridge still captures the depth image for
  # display/logging when this is false.
  depth_analysis_vlm_check: false

  # ── Pre-grasp wrist VLM check (close-range "is part between fingers?") ──
  # After the descent reaches the grasp position the workflow can ask
  # the wrist VLM whether a part is visible between the open fingers.
  # This is geometrically problematic when the wrist RGB camera is
  # mounted with a non-trivial XY offset from ee_link (typical for the
  # RealSense RSD455 mounted on a UR10 ee_link — measured ~55 mm here):
  # at grasp height (a few cm above the part), the camera looks at the
  # bin floor NEXT to the part rather than the part itself, because
  # the camera offset is a large fraction of the field of view at
  # close range. The VLM correctly reports "no part between fingers"
  # but the gripper IS over the part — we'd be aborting a valid grasp.
  #
  # Set false to skip this check and trust the earlier verifications
  # (overhead VLM, depth-analysis VLM, depth-analysis-pose wrist
  # verify) plus the contact-aware descent + adaptive close. The
  # post-grasp VLM check (gripper closed → part actually held?) still
  # runs because at that point the gripper has lifted slightly and
  # the geometry is more favourable.
  pre_grasp_wrist_vlm_check: false

  # ── Wrist VLM verify confidence threshold ──
  # The pre-grasp wrist check ("part_between_fingers") and the
  # post-grasp wrist check ("grasp_ok") both return false negatives
  # when the descent stops short (tip sensor never fires) and the
  # gripper closes on empty space — but historically the workflow
  # ignored those rejections and proceeded with the bad pick anyway.
  # Now we honour the VLM verdict ONLY when it is reasonably
  # confident, to avoid aborting on uncertain views (camera blur,
  # bad lighting, partial occlusion).
  # 0.7 default — high-confidence rejections (e.g. "fingers are
  # empty, conf=0.95") abort the pick and trigger a re-scan via the
  # outer retry loop. Low-confidence rejections fall through to the
  # historical "warn and continue" behaviour.
  # Set to 0.0 to abort on every VLM "no" (strict), or 1.0 to never
  # abort based on the wrist VLM.
  wrist_verify_min_confidence: 0.7


  # ── Camera parameters ──
  # There are none here by design. Every intrinsic and extrinsic comes
  # from the Isaac Sim API at call time: focal length + apertures from
  # the USD camera prim, pose from its live world transform, resolution
  # from the render product. If the prim's optics are invalid the bridge
  # raises instead of substituting a guess, so a misconfigured camera
  # fails loudly rather than silently projecting to the wrong place.

  # Kitting-tray surface Z (metres). Used to override the projected Z
  # when placing, since the tray sits on a different plane to the bin.
  tray_surface_z: 0.02

# ─── Orchestration (LLM) ────────────────────────────────────
orchestration:
  # The planner now uses Gemma4 by default so a single VLM serves both
  # perception and task-planning. The same Ollama endpoint is reused;
  # only the messages differ (perception sends images, planning sends
  # text only). Switch the dropdown in the Streamlit UI to pick a
  # different planner without restarting.
  llm_provider: "ollama_gemma"        # Active provider (overridden by UI model selection)
  llm_model: "gemma4:e4b"             # Active model  (overridden by UI model selection)
  llm_api_key_env: "OPENAI_API_KEY"
  llm_base_url: "${OLLAMA_BASE_URL}"   # Active endpoint
  max_retries: 3
  temperature: 0.0                    # Zero temperature for deterministic planning
  max_tokens: 4096
  max_plan_steps: 50                  # Reject plans with more steps (hallucination guard)

  # ── Available LLM Models (shown as dropdown in Streamlit UI) ──
  # Gemma4 is the default planner. Llama-3.1 is retained as a
  # fallback in case Gemma struggles on a particular command shape.
  llm_models:

    - name: "Gemma4 2B"
      provider: "ollama_gemma"
      model: "gemma4:e2b"
      base_url: "${OLLAMA_BASE_URL}"

    - name: "Gemma4 4B"
      provider: "ollama_gemma"
      model: "gemma4:e4b"
      base_url: "${OLLAMA_BASE_URL}"

    # vLLM serves models under their HuggingFace repo id — this must
    # match the --model / --served-model-name the server was started
    # with, or the request 404s with "model not found".
    - name: "Qwen3-VL (vLLM)"
      provider: "vllm"
      model: "Qwen/Qwen3-VL"
      base_url: "${VLLM_BASE_URL}"

# ─── Execution ───────────────────────────────────────────────
execution:
  # 7-DOF: [gantry_x, shoulder_pan, shoulder_lift, elbow, wrist1, wrist2, wrist3]
  home_joint_positions: [0.0, 0, -1.5708, 1.5708, -1.5708, -1.5708, 0]

  workspace_bounds:
    x_min: -2.5
    x_max: 3.5
    y_min: -2.0
    y_max: 2.0
    z_min: -0.1
    z_max: 2.0

  # Effective kinematic reach — tighter than workspace_bounds.
  # Objects outside these bounds are filtered before LLM planning
  # to prevent IK failures on unreachable targets.
  effective_reach:
    x_min: -2.0
    x_max: 3.0
    y_min: -1.3
    y_max: 1.3
    z_min: -0.05
    z_max: 999.0

  # Robotiq 2F-140 parameters
  gripper_tcp_offset: 0.170           # metres: ee_link → finger contact pad
  gripper_body_width: 0.160           # metres: widest dimension (fingers open)
  gripper_max_width: 0.085            # 85mm finger aperture
  gripper_force: 40.0                 # Newtons
  finger_open_rad: 0.0               # radians — fully open
  finger_close_rad: 0.5              # radians — ~50mm part

  # ── Approach safe-height floor (compartment-wall finger clearance) ──
  # During the approach + realign phases the IK target Z is clamped
  # so the gripper FINGER TIPS sit at least this many metres above
  # the COMPARTMENT wall top of the part being picked. Per-part
  # formula:
  #     safe_floor = part_z + box_height + gripper_tcp_offset + this_value
  # ``box_height`` (compartment wall height ABOVE the part — defined
  # below) is the right reference here; the whole-rack ``bin_top_z``
  # would push ee_link past the arm's vertical reach. Tune up (e.g.
  # 0.04) if fingers still clip the compartment lip, down (e.g. 0.01)
  # if the approach is unnecessarily high. 0.0 = no extra buffer
  # (finger TCP exactly at compartment wall top).
  bin_wall_finger_clearance: 0.04

  # ── Place transit clearance (kitting tray) ──
  # During the place phase the workflow pulls the kitting tray (X, Y, Z)
  # directly from the USD prim ``simulation.tray_prim_path`` (Phase 0
  # lookup) and sends the RAW tray top_z to the bridge — so the actual
  # drop point stays ~2 cm above the tray surface (clean release, not
  # a long fall). This value is sent as a SEPARATE ``transit_clearance``
  # parameter that only the bridge's transit phase consumes — it adds
  # extra altitude during the lateral-move steps so Lula IK has more
  # headroom to find a non-folded arm pose (avoids the elbow/forearm
  # clipping the tray rim or base). Does NOT affect the place / drop
  # height.
  # Tune up (e.g. 0.45) if the arm still folds awkwardly during transit,
  # down (e.g. 0.20) if transit is unnecessarily high. 0.0 disables the
  # extra clearance (transit uses the bridge's default 14 cm).
  place_transit_clearance: 0.20

  # Gap (metres) between gripper finger TCP and the tray surface at
  # the release point. Higher = part dropped from further above (small
  # bounce on landing); lower = part placed more gently but risks rim
  # catch if the tray geometry varies. Default 0.03 m (3 cm). Sent to
  # the bridge as ``place_z_buffer`` and overrides the bridge's default
  # PLACE_DROP_HEIGHT (2 cm).
  place_drop_z_buffer: 0.03

  # ── Pick descent contact-stop ──
  # Minimum contact-sensor force (Newtons) to declare "in contact"
  # during the Cartesian descent in ``/api/pick_descend``. When a
  # finger touches ANYTHING (part / floor / divider) at or above this
  # force, the descent stops immediately — preventing the gripper from
  # being pushed into the bin floor when the planned grasp_z is below
  # the part's actual top.
  # Default 0.2 N — light enough to catch the first touch on small/
  # low-mass parts (gears, hinges) before the gripper deflects them.
  # The bridge logs the sensor reading EVERY step of the descent, so
  # you can verify in the Isaac Sim console whether the sensor is
  # actually responding. If it reads 0.000 N the whole way, the
  # sensor isn't working (check the [OK] Contact sensor ready line on
  # bridge startup). Tune up (e.g. 0.5–1.0) only if false stops are
  # triggered by noise on heavier parts.
  descent_contact_min_force: 0.2

  # When the contact sensor stops the descent, lift the gripper back
  # up by this many metres before the close phase begins. The
  # contact-stop pin the finger pads against whatever was touched
  # (bin floor, part top, divider) — fingers can't close around the
  # part because they're already pressed against the surface. A 1-2 mm
  # lift gives the fingers clearance to close cleanly. Set to 0.0 to
  # disable the lift-back (fingers stop exactly at contact).
  descent_contact_lift_back: 0.005

  # ── Local grasp retry (lift + rescan, no full pipeline restart) ──
  # When the mechanical close fails (gripper closed on empty space)
  # OR the post-grasp wrist VLM reports an empty gripper, this many
  # local retries are tried BEFORE escalating to the outer pipeline
  # retry. A local retry:
  #     1. Opens the gripper.
  #     2. Lifts ee_link to ``depth_analysis_height`` above the part.
  #     3. Re-runs the close-range wrist rescan to refine XY.
  #     4. Re-attempts the descent + close at the refined target.
  # Saves ~30-60 s per failed attempt vs a full Phase 2 + Phase 3
  # rerun. 0 disables (always escalate); 2 means up to three total
  # attempts (1 initial + 2 local retries) before escalating.
  local_grasp_retries: 2

  # ── Close-range explicit XY rescan ─────────────────────────
  # After the gantry+IK approach has parked the gripper near the
  # planned target, this step does ONE more wrist-camera reading
  # with explicit coordinate transparency: it logs ee_link world
  # XY, wrist camera world XY, the camera→ee_link offset, and the
  # projected part XY — then updates the grasp target to put the
  # GRIPPER (which sits at ee_link XY in this geometry) directly
  # over the projected part. This is operator-requested verification
  # that the camera-vs-ee_link offset is being normalised correctly
  # — every transform is observable in the logs as
  # ``[Rescan]   ...`` lines.
  #
  # Differs from ``wrist_rescan_before_grasp`` (below): that uses
  # the FULL perception pipeline (VLM + OWL-ViT2). This one uses
  # only a focused single-target VLM prompt — cheaper, simpler,
  # and shows the geometry math explicitly.
  close_range_rescan_xy: false
  # Reject rescan corrections beyond this radius (5 cm default).
  # Larger shifts almost always mean the wrist VLM picked a
  # neighbour part instead of the centre-most planned target;
  # applying such a shift would land the gripper on the wrong
  # part. Tune up if you trust the wrist VLM more, down for
  # stricter rejection.
  close_range_rescan_max_shift: 0.05

  # ── Wrist rescan before grasp ──
  # After the approach + verify_and_realign at the depth-analysis pose,
  # re-run the FULL perception pipeline (VLM scene scan + OWL-ViT2 +
  # depth projection) on the wrist camera image to refine the grasp
  # XY. The wrist camera at ~30-50 cm range gives ~10x the angular
  # resolution of the overhead camera, so the OWL-ViT2 bbox lands on
  # the part silhouette tightly enough that depth projection nails
  # world XY to within a few millimetres — much tighter than the
  # focused wrist-VLM check inside _verify_and_realign.
  # Costs one extra VLM call per pick (~30-90 s on Gemma4). Set false
  # to disable when the rough verify_and_realign offset is good
  # enough and you want faster picks.
  wrist_rescan_before_grasp: false

  # Reject wrist-rescan corrections whose XY offset from the planned
  # coords exceeds this many metres. The rescan is meant to be a
  # millimetre-to-centimetre refinement; large shifts usually indicate
  # the wrist VLM detected a NEIGHBOUR part or had a partial /
  # occluded view — applying such a correction would force a big
  # lateral move at depth-analysis altitude and the IK can swing the
  # arm into the bin's back wall. Default 0.04 m (4 cm). Tune up
  # (e.g. 0.06) only if you're confident the wrist always sees the
  # right part. Tune down (e.g. 0.02) for stricter rejection.
  max_wrist_rescan_offset_xy: 0.04

  # Empirical XY-offset compensation applied to the wrist-rescan
  # refined coordinates before targeting the gripper. The wrist RGB
  # camera, depth sensor, and ee_link may all be slightly offset from
  # each other in USD; the projection chain SHOULD account for this
  # via the camera prim's transform, but if you observe a residual
  # systematic offset between the detected part centre (X mark on
  # the wrist overlay) and the gripper's actual landing point, sweep
  # these knobs experimentally:
  #   0.000  → no compensation (default)
  #   0.013  → shift +13 mm
  #  -0.005  → shift -5 mm
  # The bridge logs the end-of-descent EE drift after each pick:
  #   [DESCEND] drift (dx, dy, dz) = (+xx.x, +yy.y, +zz.z) mm
  # If the drift is consistent across picks, set the negative of
  # those values here as the compensation.
  wrist_target_x_offset: 0.0
  wrist_target_y_offset: 0.0

  # ── Place flow: arm config reset after gantry move ──
  # After the pick retract + gantry slide, the arm joints are in
  # whatever configuration Lula picked for the retract IK — sometimes
  # an "elbow-forward" pose with the forearm projecting into the
  # workspace. The lateral move + descent are Cartesian (chained
  # warm-starts), so they PRESERVE that configuration all the way to
  # the tray. The result: the arm body folds over the tray rim while
  # the gripper descends. Enable this to re-IK at the same Cartesian
  # position with HOME_JOINTS as warm start, biasing the solver
  # toward an elbow-up pose before the descent starts.
  # Set false to disable (e.g., if the home-bias reset itself causes
  # an awkward joint flip and you want the previous behaviour).
  place_reset_arm_config: true

  # ── Wrist-scan pipeline heights (above bin / tray top, metres) ──
  # bin_scan_height:       wrist sits this far above bin top to capture
  #                        a single image that frames the whole bin.
  # pick_align_height:     after the VLM picks a target, the gantry
  #                        re-aligns so the wrist is centred over the
  #                        part at this height before depth analysis.
  # depth_analysis_height: close-range height for the wrist depth
  #                        camera to refine the grasp pose.
  # tray_safe_height:      wrist clearance above the kitting tray
  #                        rim during placement.
  bin_scan_height:        0.60
  pick_align_height:      0.40
  depth_analysis_height:  1.10   # D555 accurate range ~0.6-6 m (was 0.20 for RSD455)
  tray_safe_height:       0.25

  # Motion parameters
  pre_grasp_height_offset: 0.15      # 15cm above object for approach
  hover_clearance: 0.015             # gap above part top before plunge
  box_height: 0.20                   # metres — box wall height above part
  box_entry_margin: 0.20             # metres — clearance above rim
  place_drop_height: 0.0             # metres above destination surface
  place_retract_height: 0.20         # metres above destination after release
  transit_safe_height: 0.35          # metres above safe_z during transit
  max_pick_retries: 3               # retry scan + pick if grasp fails
  grasp_depth_fraction: 0.5          # 0.0=top, 0.5=mid, 1.0=bottom

  # Safety
  action_timeout_seconds: 30         # max seconds per action primitive
  downward_orientation: [1.0, 0.0, 1.0, 0.0]   # [w, x, y, z] quaternion

# ─── Logging ─────────────────────────────────────────────────
logging:
  level: "INFO"
  log_file: "kitting_session.log"
  save_vlm_images: true
  save_task_plans: true
  log_dir: "logs"
