# ============================================================
# Generative Kitting System — Master Configuration
# ============================================================

simulation:
  usd_scene_path: "C:/KP/AI_and_Automation/Sem_4/Thesis/robot_in_air/AIKIDO.usd"
  robot_prim_path: "/World"
  ur10_base_path: "/World/gantry_home/ur10_flattened/ur10_instanceable/base_link"
  ee_path: "/World/gantry_home/ur10_flattened/ur10_instanceable/ee_link"
  camera_prim_path: "/World/Camera"
  depth_camera_prim_path: "/World/Realsense/RSD455/Camera_Pseudo_Depth"
  imu_sensor_prim_path: "/World/Realsense/RSD455/Imu_Sensor"
  physics_dt: 0.01667          # 1/60
  rendering_dt: 0.01667        # 1/60

  # Gantry configuration
  gantry_x_joint: "gantry_vagn_joint"
  gantry_x_offset: 1.27

  # URDF/YAML paths for Lula IK solver
  urdf_path: "c:/kp/ai_and_automation/sem_4/thesis/isaacsim/exts/isaacsim.asset.importer.urdf/data/urdf/robots/ur10/urdf/ur10.urdf"
  yaml_path: "c:/kp/ai_and_automation/sem_4/thesis/isaacsim/exts/isaacsim.robot_motion.motion_generation/motion_policy_configs/universal_robots/ur10/rmpflow/ur10_robot_description.yaml"

  # Gripper finger prim paths (Robotiq 2F-140)
  gripper_finger_paths:
    - "/World/gantry_home/ur10_flattened/ur10_instanceable/robotiq_fixed_physics/Robotiq_2F_140_physics_edit/left_inner_finger"
    - "/World/gantry_home/ur10_flattened/ur10_instanceable/robotiq_fixed_physics/Robotiq_2F_140_physics_edit/right_inner_finger"
    - "/World/gantry_home/ur10_flattened/ur10_instanceable/robotiq_fixed_physics/Robotiq_2F_140_physics_edit/left_outer_finger"
    - "/World/gantry_home/ur10_flattened/ur10_instanceable/robotiq_fixed_physics/Robotiq_2F_140_physics_edit/right_outer_finger"
    - "/World/gantry_home/ur10_flattened/ur10_instanceable/robotiq_fixed_physics/Robotiq_2F_140_physics_edit/robotiq_base_link"
  box_prim_path: "/World/robot_facade_full"

  # ── Wrist-scan pipeline (current approach) ─────────────────────
  # The overhead camera is now used for the live UI feed only —
  # all part-perception happens through the wrist-mounted RealSense.
  # The robot moves above the bin, faces ee_link downward, and the
  # wrist RGB image is fed to the VLM. Bin + tray world coordinates
  # come from these USD prims (no overhead VLM landmark detection).
  bin_prim_path:  "/World/robot_facade_full"
  tray_prim_path: "/World/box_840"
  wrist_rgb_camera_prim_path: "/World/Realsense/RSD455/Camera_OmniVision_OV9782_Color"

  # Scan-pose marker prim REMOVED from the scene — the workflow now
  # derives the safe ee_link Z geometrically from
  #   bin_top_z + execution.gripper_tcp_offset
  #              + execution.bin_wall_finger_clearance
  # See KittingWorkflowEngine._safe_floor_z(). Re-add a marker prim
  # path here only if you want to override the geometric formula with
  # a static USD transform.
  # scan_pose_prim_path: "/World/robo_eye"

  # ee_link orientation [w, x, y, z] applied at every realign before
  # a pick. Default rotates the standard downward pose by -90° yaw
  # about world Z so the wrist camera ends up on the FRONT side of
  # the gripper (not the back). Tweak the sign of z if the camera
  # ends up on the wrong side. Keep the quaternion normalised; null
  # / missing → bridge falls back to DOWNWARD_ORIENTATION.
  scan_pose_orientation: [0.5, 0.5, 0.5, -0.5]

# ─── Perception (VLM) ───────────────────────────────────────
perception:
  vlm_provider: "ollama_qwen"         # Active provider (overridden by UI model selection)
  vlm_model: "qwen2.5vl:7b"          # Active model  (overridden by UI model selection)
  vlm_base_url: "http://10.7.0.35:11434"   # Active endpoint (overridden by UI model selection)
  max_retries: 2
  temperature: 0.0                    # Low temperature for deterministic perception
  confidence_threshold: 0.5           # Reject objects below this confidence
  vlm_num_ctx: 32768                  # Larger context for catalogue + image tokens
  vlm_num_predict: 8192               # Give Qwen more room to finish JSON instead of truncating at 4096

  # ── Available VLM Models (shown as dropdown in Streamlit UI) ──
  # Add your VPN model endpoints here.  "name" is the dropdown label.
  vlm_models:

    # ── VPN Remote Server ────────────────────────────────────

    - name: "Gemma4 4B (VPN Remote)"
      provider: "ollama_gemma"
      model: "gemma4:e4b"
      base_url: "http://10.7.0.35:11434"

    - name: "Qwen3-VL 8B (VPN Remote)"
      provider: "ollama_qwen"
      model: "qwen3-vl:8b"
      base_url: "http://10.7.0.35:11434"

    - name: "Qwen3-VL 30B (VPN Remote)"
      provider: "ollama_qwen"
      model: "qwen3-vl:30b"
      base_url: "http://10.7.0.35:11434"

  # ── Zero-Shot Detector (precise bounding boxes — replaces VLM coord guesses) ──
  # detector_url: "http://10.7.0.35:8700"  # uncomment to use remote server instead of local
  detector_model: "owlv2"              # "owlv2" (lightweight) or "grounding_dino" (more accurate)
  detector_confidence: 0.15            # minimum detection confidence
  detector_device: "cpu"               # "cpu" or "cuda" (set to cuda if you have a local GPU)

  # When true, drop any VLM-detected object that did NOT get a
  # matching detector bbox. Without a bbox, depth projection runs
  # on the VLM's guessed image_position which is unreliable (off
  # by 5-15%, sometimes hallucinated entirely) and can send the
  # robot to a divider wall. Bbox-confirmed detections are far
  # safer because they require BOTH the VLM (correct label) AND
  # the detector (correct location) to agree.
  # Set false ONLY if you trust the VLM's image_position alone.
  require_detector_bbox: true

  # ── Detector safety net (OWL-ViT2 / Grounding DINO path only) ──
  # Run OWL-ViT2 with the FULL parts_catalogue.yaml detector_queries on
  # every scan, not just the labels Gemma4 reported. For every OWL hit
  # that no VLM detection claimed, synthesise a scene object using the
  # query → canonical label map. This recovers parts when the VLM (e.g.
  # Gemma4 4B) inconsistently misses some — OWL still finds them.
  # Disable for strict VLM-led behaviour.
  detector_finds_missed_parts: true

  # ── Per-instance VLM label verification (open-vocabulary) ──
  # After the scene is populated, crop each detection and ask the VLM
  # "what is this?" with the catalogue as the choice set. Re-labels
  # mistakes from the first-pass VLM and from OWL query mislabelling
  # (e.g. motor_valves grabbed by the "silver hinge" query). Catalogue
  # is the single source of truth — adding a new part means a YAML
  # edit, no code changes, and no per-camera tuning. Costs N extra VLM
  # calls per scan (~3-10s each on a small crop), so default is OFF.
  # Enable when first-pass labels are unreliable.
  verify_labels_with_vlm: false
  # Minimum VLM confidence to override an existing label. Lower values
  # are more aggressive (more re-labels), higher values are conservative.
  verify_labels_min_confidence: 0.5

  # ── Per-instance Qwen crop-and-zoom refinement (Qwen-only path) ──
  # After the first-pass scene grounding returns rough bboxes, crop a
  # 2x area around each detection and re-query Qwen with a single-
  # instance grounding prompt ("Outline the position of the {label}").
  # Qwen3-VL's RefCOCO-trained pathway is far more precise when there
  # is exactly one target in view. Costs N extra Qwen calls per scan
  # (~30-60 s each on Ollama for 8B), so default is OFF. Enable when
  # multi-instance grounding is loose / boxes drift / instances cluster.
  refine_with_crop_zoom: true

  # ── Depth Estimation (fallback when bridge depth buffer unavailable) ──
  # NOTE: the bridge's /api/project_to_world reads the camera prim's
  # actual world transform from USD on every call — these values are
  # NO LONGER USED for production depth projection. They remain only
  # as fallback constants for the legacy DepthEstimator class which
  # the workflow does not currently invoke. To verify the camera
  # height the bridge actually uses, look for the line
  #   "[project] Camera world pos: (X, Y, Z)"
  # in the Isaac Sim console — the Z value is what matters.
  depth_method: "geometric"            # "geometric" (no ML) or "depth_anything" (Depth Anything V2)
  camera_height_m: 5.10                # legacy; bridge uses USD prim transform instead
  camera_fov_h_deg: 60.0               # legacy; bridge reads focal_length + aperture from USD
  camera_resolution: [1920, 1080]      # overhead camera resolution
  # Image-axis sign overrides for the bridge's depth projection.
  # Set to -1 to flip an axis if the camera was placed in USD with a
  # non-standard rotation that mirrors detected world coords. Default
  # +1 = OpenGL convention. After running once, check the bridge log
  # for "Camera basis in world:" — if `up (+Y_cam)` points OPPOSITE
  # to world +Y when the image-up corresponds to world +Y, set
  # camera_image_y_sign: -1.
  camera_image_x_sign: 1               # flip image X axis (-1 to mirror)
  camera_image_y_sign: 1               # flip image Y axis (-1 to mirror)
  workspace_surface_z: 0.02            # Z height of bin surface where parts sit (metres)
  tray_surface_z: 0.02                 # Z height of kitting tray surface (geometric fallback)
                                       # Adjust if tray sits higher/lower than parts bin
  camera_world_x: 0.0                  # camera world X position (metres)
  camera_world_y: 0.0                  # camera world Y position (metres)

# ─── Orchestration (LLM) ────────────────────────────────────
orchestration:
  llm_provider: "ollama_llama"        # Active provider (overridden by UI model selection)
  llm_model: "llama3.1:8b"           # Active model  (overridden by UI model selection)
  llm_api_key_env: "OPENAI_API_KEY"
  llm_base_url: "http://localhost:11434"   # Active endpoint (overridden by UI model selection)
  max_retries: 3
  temperature: 0.0                    # Zero temperature for deterministic planning
  max_tokens: 4096
  max_plan_steps: 50                  # Reject plans with more steps (hallucination guard)

  # ── Available LLM Models (shown as dropdown in Streamlit UI) ──
  # Add your VPN model endpoints here.  "name" is the dropdown label.
  llm_models:

    # ── VPN Remote Server ────────────────────────────────────
    - name: "Llama 3.1 8B (VPN Remote)"
      provider: "ollama_llama"
      model: "llama3.1:8b"
      base_url: "http://10.7.0.35:11434"

# ─── Execution ───────────────────────────────────────────────
execution:
  # 7-DOF: [gantry_x, shoulder_pan, shoulder_lift, elbow, wrist1, wrist2, wrist3]
  home_joint_positions: [0.0, 0, -1.5708, 1.5708, -1.5708, -1.5708, 0]

  workspace_bounds:
    x_min: -2.5
    x_max: 3.5
    y_min: -2.0
    y_max: 2.0
    z_min: -0.1
    z_max: 2.0

  # Effective kinematic reach — tighter than workspace_bounds.
  # Objects outside these bounds are filtered before LLM planning
  # to prevent IK failures on unreachable targets.
  effective_reach:
    x_min: -2.0
    x_max: 3.0
    y_min: -1.3
    y_max: 1.3
    z_min: -0.05
    z_max: 999.0

  # Robotiq 2F-140 parameters
  gripper_tcp_offset: 0.170           # metres: ee_link → finger contact pad
  gripper_body_width: 0.160           # metres: widest dimension (fingers open)
  gripper_max_width: 0.085            # 85mm finger aperture
  gripper_force: 40.0                 # Newtons
  finger_open_rad: 0.0               # radians — fully open
  finger_close_rad: 0.5              # radians — ~50mm part

  # ── Approach safe-height floor (compartment-wall finger clearance) ──
  # During the approach + realign phases the IK target Z is clamped
  # so the gripper FINGER TIPS sit at least this many metres above
  # the COMPARTMENT wall top of the part being picked. Per-part
  # formula:
  #     safe_floor = part_z + box_height + gripper_tcp_offset + this_value
  # ``box_height`` (compartment wall height ABOVE the part — defined
  # below) is the right reference here; the whole-rack ``bin_top_z``
  # would push ee_link past the arm's vertical reach. Tune up (e.g.
  # 0.04) if fingers still clip the compartment lip, down (e.g. 0.01)
  # if the approach is unnecessarily high. 0.0 = no extra buffer
  # (finger TCP exactly at compartment wall top).
  bin_wall_finger_clearance: 0.04

  # ── Place transit clearance (kitting tray) ──
  # During the place phase the workflow pulls the kitting tray (X, Y, Z)
  # directly from the USD prim ``simulation.tray_prim_path`` (Phase 0
  # lookup) and sends the RAW tray top_z to the bridge — so the actual
  # drop point stays ~2 cm above the tray surface (clean release, not
  # a long fall). This value is sent as a SEPARATE ``transit_clearance``
  # parameter that only the bridge's transit phase consumes — it adds
  # extra altitude during the lateral-move steps so Lula IK has more
  # headroom to find a non-folded arm pose (avoids the elbow/forearm
  # clipping the tray rim or base). Does NOT affect the place / drop
  # height.
  # Tune up (e.g. 0.45) if the arm still folds awkwardly during transit,
  # down (e.g. 0.20) if transit is unnecessarily high. 0.0 disables the
  # extra clearance (transit uses the bridge's default 14 cm).
  place_transit_clearance: 0.20

  # Gap (metres) between gripper finger TCP and the tray surface at
  # the release point. Higher = part dropped from further above (small
  # bounce on landing); lower = part placed more gently but risks rim
  # catch if the tray geometry varies. Default 0.03 m (3 cm). Sent to
  # the bridge as ``place_z_buffer`` and overrides the bridge's default
  # PLACE_DROP_HEIGHT (2 cm).
  place_drop_z_buffer: 0.03

  # ── Pick descent contact-stop ──
  # Minimum contact-sensor force (Newtons) to declare "in contact"
  # during the Cartesian descent in ``/api/pick_descend``. When a
  # finger touches ANYTHING (part / floor / divider) at or above this
  # force, the descent stops immediately — preventing the gripper from
  # being pushed into the bin floor when the planned grasp_z is below
  # the part's actual top.
  # Default 0.2 N — light enough to catch the first touch on small/
  # low-mass parts (gears, hinges) before the gripper deflects them.
  # The bridge logs the sensor reading EVERY step of the descent, so
  # you can verify in the Isaac Sim console whether the sensor is
  # actually responding. If it reads 0.000 N the whole way, the
  # sensor isn't working (check the [OK] Contact sensor ready line on
  # bridge startup). Tune up (e.g. 0.5–1.0) only if false stops are
  # triggered by noise on heavier parts.
  descent_contact_min_force: 0.2

  # When the contact sensor stops the descent, lift the gripper back
  # up by this many metres before the close phase begins. The
  # contact-stop pin the finger pads against whatever was touched
  # (bin floor, part top, divider) — fingers can't close around the
  # part because they're already pressed against the surface. A 1-2 mm
  # lift gives the fingers clearance to close cleanly. Set to 0.0 to
  # disable the lift-back (fingers stop exactly at contact).
  descent_contact_lift_back: 0.002

  # ── Wrist rescan before grasp ──
  # After the approach + verify_and_realign at the depth-analysis pose,
  # re-run the FULL perception pipeline (VLM scene scan + OWL-ViT2 +
  # depth projection) on the wrist camera image to refine the grasp
  # XY. The wrist camera at ~30-50 cm range gives ~10x the angular
  # resolution of the overhead camera, so the OWL-ViT2 bbox lands on
  # the part silhouette tightly enough that depth projection nails
  # world XY to within a few millimetres — much tighter than the
  # focused wrist-VLM check inside _verify_and_realign.
  # Costs one extra VLM call per pick (~30-90 s on Gemma4). Set false
  # to disable when the rough verify_and_realign offset is good
  # enough and you want faster picks.
  wrist_rescan_before_grasp: true

  # Reject wrist-rescan corrections whose XY offset from the planned
  # coords exceeds this many metres. The rescan is meant to be a
  # millimetre-to-centimetre refinement; large shifts usually indicate
  # the wrist VLM detected a NEIGHBOUR part or had a partial /
  # occluded view — applying such a correction would force a big
  # lateral move at depth-analysis altitude and the IK can swing the
  # arm into the bin's back wall. Default 0.04 m (4 cm). Tune up
  # (e.g. 0.06) only if you're confident the wrist always sees the
  # right part. Tune down (e.g. 0.02) for stricter rejection.
  max_wrist_rescan_offset_xy: 0.04

  # Empirical XY-offset compensation applied to the wrist-rescan
  # refined coordinates before targeting the gripper. The wrist RGB
  # camera, depth sensor, and ee_link may all be slightly offset from
  # each other in USD; the projection chain SHOULD account for this
  # via the camera prim's transform, but if you observe a residual
  # systematic offset between the detected part centre (X mark on
  # the wrist overlay) and the gripper's actual landing point, sweep
  # these knobs experimentally:
  #   0.000  → no compensation (default)
  #   0.013  → shift +13 mm
  #  -0.005  → shift -5 mm
  # The bridge logs the end-of-descent EE drift after each pick:
  #   [DESCEND] drift (dx, dy, dz) = (+xx.x, +yy.y, +zz.z) mm
  # If the drift is consistent across picks, set the negative of
  # those values here as the compensation.
  wrist_target_x_offset: 0.0
  wrist_target_y_offset: 0.0

  # ── Place flow: arm config reset after gantry move ──
  # After the pick retract + gantry slide, the arm joints are in
  # whatever configuration Lula picked for the retract IK — sometimes
  # an "elbow-forward" pose with the forearm projecting into the
  # workspace. The lateral move + descent are Cartesian (chained
  # warm-starts), so they PRESERVE that configuration all the way to
  # the tray. The result: the arm body folds over the tray rim while
  # the gripper descends. Enable this to re-IK at the same Cartesian
  # position with HOME_JOINTS as warm start, biasing the solver
  # toward an elbow-up pose before the descent starts.
  # Set false to disable (e.g., if the home-bias reset itself causes
  # an awkward joint flip and you want the previous behaviour).
  place_reset_arm_config: true

  # ── Wrist-scan pipeline heights (above bin / tray top, metres) ──
  # bin_scan_height:       wrist sits this far above bin top to capture
  #                        a single image that frames the whole bin.
  # pick_align_height:     after the VLM picks a target, the gantry
  #                        re-aligns so the wrist is centred over the
  #                        part at this height before depth analysis.
  # depth_analysis_height: close-range height for the wrist depth
  #                        camera to refine the grasp pose.
  # tray_safe_height:      wrist clearance above the kitting tray
  #                        rim during placement.
  bin_scan_height:        0.60
  pick_align_height:      0.40
  depth_analysis_height:  0.20
  tray_safe_height:       0.25

  # Motion parameters
  pre_grasp_height_offset: 0.15      # 15cm above object for approach
  hover_clearance: 0.015             # gap above part top before plunge
  box_height: 0.20                   # metres — box wall height above part
  box_entry_margin: 0.20             # metres — clearance above rim
  place_drop_height: 0.0             # metres above destination surface
  place_retract_height: 0.20         # metres above destination after release
  transit_safe_height: 0.30          # metres above safe_z during transit
  max_pick_retries: 3               # retry scan + pick if grasp fails
  grasp_depth_fraction: 0.5          # 0.0=top, 0.5=mid, 1.0=bottom

  # Safety
  action_timeout_seconds: 30         # max seconds per action primitive
  downward_orientation: [1.0, 0.0, 1.0, 0.0]   # [w, x, y, z] quaternion

# ─── Logging ─────────────────────────────────────────────────
logging:
  level: "INFO"
  log_file: "kitting_session.log"
  save_vlm_images: true
  save_task_plans: true
  log_dir: "logs"
